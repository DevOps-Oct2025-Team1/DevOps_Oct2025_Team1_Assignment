# Docker Compose override file for integration testing
# This file overrides docker-compose.yml settings for testing purposes
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up

version: "3.9"
services:
  # Expose database ports for host-side integration tests
  auth-db:
    ports:
      - "5432:5432"

  chats_db:
    ports:
      - "5433:5432"

networks:
  # Allow external access to networks for integration testing
  auth-network:
    internal: false
  llm-network:
    internal: false
