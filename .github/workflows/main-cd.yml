name: GKE Production CD

on:
  workflow_run:
    workflows: ["Production Release Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    uses: ./.github/workflows/reusable-gke-deploy.yml
    with:
      environment: production
      project_id_secret_name: GCP_PROJECT_ID
      trigger_workflow_name: "Production Release Pipeline"
    secrets:
      gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      gcp_sa_key: ${{ secrets.GCP_SA_KEY }}
      gke_region: ${{ secrets.GKE_REGION }}
      artifact_repo: ${{ secrets.ARTIFACT_REPO }}
      gke_cluster: ${{ secrets.GKE_CLUSTER }}
      postgres_db: ${{ secrets.POSTGRES_DB }}
      postgres_user: ${{ secrets.POSTGRES_USER }}
      postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      jwt_secret: ${{ secrets.JWT_SECRET }}
      default_testuser_username: ${{ secrets.DEFAULT_TESTUSER_USERNAME }}
      default_testuser_password: ${{ secrets.DEFAULT_TESTUSER_PASSWORD }}
      default_admin_username: ${{ secrets.DEFAULT_ADMIN_USERNAME }}
      default_admin_password: ${{ secrets.DEFAULT_ADMIN_PASSWORD }}
      chats_postgres_db: ${{ secrets.CHATS_POSTGRES_DB }}
      chats_postgres_user: ${{ secrets.CHATS_POSTGRES_USER }}
      chats_postgres_password: ${{ secrets.CHATS_POSTGRES_PASSWORD }}
      pubsub_project_id: ${{ secrets.PUBSUB_PROJECT_ID }}
      pubsub_emulator_host: ${{ secrets.PUBSUB_EMULATOR_HOST }}
      pubsub_topic_id: ${{ secrets.PUBSUB_TOPIC_ID }}
      pubsub_subscription_id: ${{ secrets.PUBSUB_SUBSCRIPTION_ID }}
      vite_api_url: ${{ secrets.VITE_API_URL }}
