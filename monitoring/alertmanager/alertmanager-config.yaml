global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    # Critical alerts → Developer + QA
    - match:
        severity: critical
      receiver: 'discord-critical'
      continue: false
    # Warning alerts → QA only
    - match:
        severity: warning
      receiver: 'discord-warning'
      continue: false

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://discord-relay:8080/webhook/main'
        send_resolved: true
  
  - name: 'discord-critical'
    webhook_configs:
      - url: 'http://discord-relay:8080/webhook/critical'
        send_resolved: true
  
  - name: 'discord-warning'
    webhook_configs:
      - url: 'http://discord-relay:8080/webhook/warning'
        send_resolved: true
