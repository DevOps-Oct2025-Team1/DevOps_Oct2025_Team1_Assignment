steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api-gateway:latest', '.']
    id: 'Build API Gateway'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api-gateway:latest'

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'devops-test-repo'
