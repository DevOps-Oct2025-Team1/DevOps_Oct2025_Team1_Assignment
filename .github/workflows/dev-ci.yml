name: Dev Branch CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  ci-dev:
    runs-on: ubuntu-latest
    # Required for uploading security results to the GitHub Security Tab
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- DEVELOPMENT PHASE ---
      - name: Run Go Unit Tests
        id: unit_tests
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go test ./... -v

      - name: Integration Tests (Placeholder)
        id: integration_tests
        run: echo "Integration tests will run here"

      # --- SECURITY PHASE (SAST) ---
      - name: Run Go SAST (GoSec)
        id: sast_scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # Generate SARIF for the Security Tab; continue on error to allow upload
          gosec -fmt sarif -out gosec-results.sarif ./... || true

      - name: Upload GoSec to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      # --- SECURITY PHASE (SCA) ---
      - name: Run SCA (Trivy)
        id: sca_scan
        uses: aquasec/trivy-action@v2
        with:
          scan-type: fs
          scan-ref: .
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # --- PERFORMANCE PHASE ---
      - name: Performance Tests (Placeholder)
        id: perf_tests
        run: echo "Performance tests will run here"

      # --- ADVANCED NOTIFICATION ROUTING (6.1) ---

      # Initial Status Alert
      - name: Notify Discord - CI Started
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_D }}
        with:
          args: "🚀 **CI STARTED** | Branch: `${{ github.ref_name }}` | Actor: `${{ github.actor }}`"

      # ROUTE: BUILD BREAKS (Dev Channel)
      - name: Notify Discord - Unit Test Failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
        with:
          args: "❌ **UNIT TEST FAILED**: Logic errors in Go code. Fix required. \nView Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify Discord - Integration Test Failure
        if: failure() && steps.integration_tests.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
        with:
          args: "🔗 **INTEGRATION FAILURE**: Pub/Sub queue or service communication error. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ROUTE: SECURITY ALERTS (QA Channel)
      - name: Notify Discord - SAST Alert
        if: failure() && steps.sast_scan.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_QA }}
        with:
          args: "🛡️ **SAST ALERT (GoSec)**: Code-level vulnerabilities detected. \nCheck Security Tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning"

      - name: Notify Discord - SCA Alert
        if: failure() && steps.sca_scan.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_QA }}
        with:
          args: "📦 **SCA ALERT (Trivy)**: Vulnerable dependencies or container images found. Check Security Tab."

      # ROUTE: PERFORMANCE (Lead Dev/Architect)
      - name: Notify Discord - Performance Failure
        if: failure() && steps.perf_tests.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_D }}
        with:
          args: "📉 **PERF REGRESSION**: Model latency or RPS thresholds exceeded on `${{ github.ref_name }}`."

      # ROUTE: RELEVANT STAKEHOLDERS (Management/AIDC Leads)
      - name: Notify Stakeholders - Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_MGMT }}
        with:
          args: "✅ **MILESTONE REACHED**: The AI Model Governance platform passed all unit, integration, and security checks. Deployment to staging is successful."
