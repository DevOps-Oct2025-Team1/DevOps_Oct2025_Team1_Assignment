name: Production Release Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REPO: ${{ secrets.ARTIFACT_REPO }}
  IMAGE_TAG: ${{ github.sha }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  prod-release:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GCP
        uses: google-github-actions/setup-gcloud@v2

        # Docker Config
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

        # Build Docker Images
      - name: Build Docker Images 
        id: build
        run: |
          PROJECT_ID=${PROJECT_ID} \
          REGION=${REGION} \
          ARTIFACT_REPO=${ARTIFACT_REPO} \
          IMAGE_TAG=${IMAGE_TAG} \
          docker compose build

      - name: Upload to GCP Artifact Registry
        id: upload
        run: |
          PROJECT_ID=${PROJECT_ID} \
          REGION=${REGION} \
          ARTIFACT_REPO=${ARTIFACT_REPO} \
          IMAGE_TAG=${IMAGE_TAG} \
          docker compose push

          # --- NOTIFICATIONS ---
      - name: Notify Discord - Production Deployment Incident
        if: failure() && steps.deploy.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚨 **CRITICAL: PRODUCTION DEPLOYMENT FAILED**
            The deployment step failed on the `main` branch. 
            **Status:** Infrastructure/Deployment Error
            **Check Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            # ROUTE: Dev Channel (Implementation Stakeholders)
      - name: Notify Discord - Main Failure
        if: failure() && steps.deploy.outcome == 'skipped'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
        with:
          args: "❌ **PROD PIPELINE BROKEN**: The build failed before deployment could start. Actor: ${{ github.actor }}"

          # ROUTE: Management Channel (Centre Appointment Holders)
      - name: Notify Discord - Release Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_MGMT }}
        with:
          args: "🏁 **PROD RELEASE COMPLETE**: The AI Model Tester platform is officially live in the AIDC environment."
