name: Production Release Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Production Pipeline Start
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "🚀 Production Release Pipeline Started"
          description: |
            <@&1460616737648148594>
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
            **Run ID:** ${{ github.run_id }}
          color: 0xff9900
          username: GitHub Actions

      # --- BUILD AND PUSH IMAGES TO ARTIFACT REGISTRY ---
      # - name: Authenticate to GCP
      #   if: github.event_name == 'push'
      #   uses: google-github-actions/auth@v2
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}

      # - name: Configure Docker for Artifact Registry
      #   if: github.event_name == 'push'
      #   run: |
      #     gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Images
        if: github.event_name == 'push'
        run: |
          # Build images
          docker build -t auth-service:${{ github.sha }} ./services/auth.service/
          docker build -t api-gateway:${{ github.sha }} ./services/api-gateway.service/
          docker build -t prompt-manager-service:${{ github.sha }} ./services/prompt-manager.service/
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} -t frontend:${{ github.sha }} ./app
          
          # Build observability services
          docker build -t discord-relay:${{ github.sha }} ./monitoring/discord-relay/
          docker build -t gcp-exporter:${{ github.sha }} ./monitoring/gcp-exporter/
          docker build -t metrics-exporter:${{ github.sha }} ./monitoring/metrics-exporter/
          
          # Tag for Artifact Registry
          # docker tag auth-service:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/auth-service:${{ github.sha }}
          # docker tag api-gateway:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/api-gateway:${{ github.sha }}
          # docker tag prompt-manager-service:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/prompt-manager-service:${{ github.sha }}
          # docker tag frontend:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/frontend:${{ github.sha }}
          
          # Tag observability services
          # docker tag discord-relay:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/discord-relay:${{ github.sha }}
          # docker tag gcp-exporter:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/gcp-exporter:${{ github.sha }}
          # docker tag metrics-exporter:${{ github.sha }} us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/metrics-exporter:${{ github.sha }}
          
          # Push to Artifact Registry
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/auth-service:${{ github.sha }}
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/api-gateway:${{ github.sha }}
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/prompt-manager-service:${{ github.sha }}
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/frontend:${{ github.sha }}
          
          # Push observability services
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/discord-relay:${{ github.sha }}
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/gcp-exporter:${{ github.sha }}
          # docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/production-docker-repo/metrics-exporter:${{ github.sha }}
          
          echo "Images pushed successfully to production Artifact Registry"

      - name: Notify Production Deployment Result
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "✅ Production Deployment Complete"
          description: |
            <@&1460616737648148594>
            **Deploy Status:** ${{ steps.deploy.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions

      - name: Notify Management
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL_MGMT }}
          status: ${{ job.status }}
          title: "📊 Production Release Status"
          description: |
            **Pipeline Status:** ${{ job.status }}
            **Deployment Status:** ${{ steps.deploy.outcome }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            **Repository:** ${{ github.repository }}
            **Event:** ${{ github.event_name }}
            **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: GitHub Actions
