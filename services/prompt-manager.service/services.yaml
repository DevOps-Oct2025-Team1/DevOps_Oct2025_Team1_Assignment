apiVersion: v1
kind: Service
metadata:
  name: prompt-manager-service
spec:
  selector:
    app: prompt-manager-service
  ports:
    - protocol: TCP
      port: ${PROMPT_MANAGER_SERVICE_PORT}
      targetPort: ${PROMPT_MANAGER_SERVICE_PORT}
---
apiVersion: v1
kind: Service
metadata:
  name: chats-postgres-service
spec:
  selector:
    app: chats-postgres-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432