name: Production Release Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prod-release:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- UNIT TESTS (from Personal CI) ---
      - name: Run Go Unit Tests
        id: unit_tests
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go test ./... -v

      # --- SECURITY PHASE (SAST - from Personal CI) ---
      - name: Run SAST (GoSec)
        id: sast
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out results.sarif ./... || true

      - name: Upload SAST to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: prod-sast

      # --- SECURITY PHASE (SCA - from Personal CI) ---
      - name: Run SCA (Trivy)
        id: sca
        uses: aquasec/trivy-action@v2
        with:
          scan-type: fs
          format: 'sarif'
          output: 'trivy-prod.sarif'
          severity: CRITICAL,HIGH

      - name: Upload SCA to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-prod.sarif
          category: prod-sca

      # --- INTEGRATION TESTING PHASE (from Dev CI) ---
      - name: Integration Tests (Placeholder)
        id: integration_tests
        run: echo "Integration tests will run here"

      # --- SECURITY PHASE (DAST - from Dev CI) ---
      - name: Run DAST (OWASP ZAP)
        id: dast
        uses: zaproxy/action-full-scan@v0.5.0
        with:
          target: 'http://localhost:8080' # Replace with production URL
          cmd_options: '-t 5 -r zap-report.html'

      # --- PERFORMANCE PHASE (from Dev CI) ---
      - name: Performance Tests (Placeholder)
        id: perf_tests
        run: echo "Performance tests will run here"

      # --- PRODUCTION DEPLOYMENT ---
      - name: Deploy to Production
        id: deploy
        run: |
          echo "Executing Terraform apply..."
          echo "Updating Kubernetes manifests..."

      # --- NOTIFICATIONS ---

      - name: Notify Discord - Production Deployment Incident
        if: failure() && steps.deploy.outcome == 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚨 **CRITICAL: PRODUCTION DEPLOYMENT FAILED**
            The deployment step failed on the `main` branch. 
            **Status:** Infrastructure/Deployment Error
            **Check Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ROUTE: Dev Channel (Implementation Stakeholders)
      - name: Notify Discord - Main Failure
        if: failure() && steps.deploy.outcome != 'failure'
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_P }}
        with:
          args: "❌ **PROD PIPELINE BROKEN**: The build failed before deployment could start. Actor: ${{ github.actor }}"

      # ROUTE: Management Channel (Centre Appointment Holders)
      - name: Notify Discord - Release Success
        if: success()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_MGMT }}
        with:
          args: "🏁 **PROD RELEASE COMPLETE**: The AI Model Tester platform is officially live in the AIDC environment."
