name: Personal Branch CI

on:
  push:
    branches-ignore: []
  pull_request:
    branches-ignore: []

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (for Backend/Auth)
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'

      - name: Run Linter
        id: linter
        run: |
          cd services/api-gateway.service && go vet ./... && cd ../..
          cd services/auth.service && go vet ./... && cd ../..

      - name: Run Unit Tests
        id: unit_tests
        run: echo "Unit tests will run here"
    
      # --- SECURITY PHASE (SAST) ---
      - name: Run Go SAST (GoSec)
        id: sast_scan
        uses: securego/gosec@v2.20.0
        with:
          # SAST analyzes source code only - SSA errors are non-critical
          args: '-fmt sarif -out gosec-results.sarif -exclude-generated ./...'
        continue-on-error: true

      - name: Upload GoSec to Security Tab
        # Updated to v4 to fix deprecation
        uses: github/codeql-action/upload-sarif@v4
        # Guard: Only upload if the file actually exists
        if: always() && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      # --- SECURITY PHASE (SCA) ---
      - name: Run SCA (Trivy)
        id: sca_scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy to Security Tab
        # Updated to v4 to fix deprecation
        uses: github/codeql-action/upload-sarif@v4
        # Guard: Only upload if the file actually exists
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy
