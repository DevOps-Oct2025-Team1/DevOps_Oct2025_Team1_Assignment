apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  # Testing: Using LoadBalancer with API_GATEWAY_IP on port 80
  type: LoadBalancer
  loadBalancerIP: ${API_GATEWAY_IP}
  # Original NodePort configuration:
  # type: NodePort
  selector:
    app: frontend
  ports:
    # Testing: Exposing on port 80
    - protocol: TCP
      port: 80
      targetPort: 5173
      # Original NodePort configuration:
      # port: 5173
      # targetPort: 5173
      # nodePort: 30173
