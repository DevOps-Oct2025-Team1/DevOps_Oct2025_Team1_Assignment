global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'oneuptime-critical'
      continue: true
    - match:
        severity: critical
      receiver: 'discord-developer-qa'
      continue: false
    - match:
        severity: warning
      receiver: 'discord-developer-qa'
      continue: false

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://discord-relay:8080/webhook/main'
        send_resolved: true
  
  - name: 'oneuptime-critical'
    webhook_configs:
      - url: 'https://oneuptime.com/heartbeat/695f4e60-04c8-11f1-b9f0-6b1be00062f9'
        send_resolved: true
  
  - name: 'discord-developer-qa'
    webhook_configs:
      - url: 'http://discord-relay:8080/webhook/dev-qa'
        send_resolved: true
